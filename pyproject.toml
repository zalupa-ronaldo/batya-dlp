[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "batya-dlp"
version = "1.1.1"
description = "A simple, local, Russian-language yt-dlp desktop GUI for Windows and macOS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.7", "uvicorn==0.54.0", "certifi==2026.10.23"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.5", "yt-dlp[default]>=2026.8.19"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
batya-dlp = "batya.launcher:main"

[tool.setuptools.package-data]
batya = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
